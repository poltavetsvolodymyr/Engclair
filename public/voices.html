<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Engclair — voices on this device</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        padding: 16px;
        background: #faf6ef;
        color: #2a2018;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 1.2rem; color: #3f6212; }
      p { margin: 0 0 12px; color: #6f6054; }
      ol { margin: 0; padding-left: 1.6em; }
      li { margin-bottom: 10px; padding-left: 4px; }
      li.other { opacity: 0.45; }
      .name { font-weight: 600; }
      .tags { color: #3f6212; font-size: 0.85em; }
      .uri { display: block; color: #6f6054; font-size: 0.8em; word-break: break-all; }
      code { background: #fff; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Voices on this device</h1>
    <p>
      Everything <code>speechSynthesis.getVoices()</code> reports here. English
      ones are what the app can offer; the rest are dimmed. Diagnostic page —
      delete once the voice list behaves.
    </p>
    <p id="summary">Reading…</p>
    <ol id="list"></ol>

    <script>
      const list = document.getElementById('list')
      const summary = document.getElementById('summary')

      function isEnglish(voice) {
        return voice.lang.replace('_', '-').toLowerCase().startsWith('en')
      }

      function render() {
        const voices = window.speechSynthesis ? speechSynthesis.getVoices() : []
        const english = voices.filter(isEnglish)

        summary.textContent =
          voices.length + ' voices in total, ' + english.length + ' of them English.'

        list.replaceChildren(
          ...voices.map((voice) => {
            const item = document.createElement('li')
            if (!isEnglish(voice)) item.className = 'other'

            const tags = [voice.lang]
            tags.push(voice.localService ? 'installed' : 'needs network')
            if (voice.default) tags.push('system default')

            item.innerHTML =
              '<span class="name"></span> <span class="tags"></span>' +
              '<span class="uri"></span>'
            item.querySelector('.name').textContent = voice.name
            item.querySelector('.tags').textContent = '· ' + tags.join(' · ')
            item.querySelector('.uri').textContent = voice.voiceURI
            return item
          }),
        )
      }

      if (window.speechSynthesis) {
        render()
        // The list is filled in asynchronously; the first read is often empty.
        speechSynthesis.addEventListener('voiceschanged', render)
      } else {
        summary.textContent = 'This browser has no speech synthesis at all.'
      }
    </script>
  </body>
</html>
